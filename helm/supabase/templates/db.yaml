apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "supabase.name" . }}-db
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
    {{- include "supabase.selectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "supabase.name" . }}-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "supabase.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supabase.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: db
          image: {{ .Values.db.image }}
          ports:
            - containerPort: {{ .Values.db.port }}
          command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
          env:
            - name: POSTGRES_HOST
              value: /var/run/postgresql
            - name: PGPORT
              value: "{{ .Values.db.port }}"
            - name: POSTGRES_PORT
              value: "{{ .Values.db.port }}"
            - name: PGDATABASE
              value: "{{ .Values.db.database }}"
            - name: POSTGRES_DB
              value: "{{ .Values.db.database }}"
            - name: JWT_EXP
              value: "{{ .Values.auth.jwtExpiry }}"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: postgres-password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: jwt-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: db-config
              mountPath: /etc/postgresql-custom
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
              subPath: _supabase.sql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
              subPath: realtime.sql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/migrations/99-logs.sql
              subPath: logs.sql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
              subPath: pooler.sql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
              subPath: webhooks.sql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
              subPath: roles.sql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
              subPath: jwt.sql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "localhost"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: db-config
          emptyDir: {}
        - name: init-scripts
          configMap:
            name: {{ include "supabase.name" . }}-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.db.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supabase.name" . }}-db
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.db.port }}
      targetPort: {{ .Values.db.port }}
  selector:
    {{- include "supabase.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supabase.name" . }}-db-external
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  type: NodePort
  ports:
    - port: {{ .Values.db.port }}
      targetPort: {{ .Values.db.port }}
      nodePort: {{ .Values.db.nodePort }}
  selector:
    {{- include "supabase.selectorLabels" . | nindent 4 }}
