apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supabase.name" . }}-rest
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
    {{- include "supabase.selectorLabels" (dict "name" "rest" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "supabase.selectorLabels" (dict "name" "rest" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supabase.selectorLabels" (dict "name" "rest" "root" .) | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "supabase.name" . }}-db {{ .Values.db.port }}; do echo waiting for db; sleep 2; done']
      containers:
        - name: rest
          image: {{ .Values.rest.image }}
          ports:
            - containerPort: {{ .Values.rest.port }}
          command: ["postgrest"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: postgres-password
            - name: PGRST_DB_URI
              value: "postgres://authenticator:$(POSTGRES_PASSWORD)@{{ include "supabase.name" . }}-db:{{ .Values.db.port }}/{{ .Values.db.database }}"
            - name: PGRST_DB_SCHEMAS
              value: "{{ .Values.rest.dbSchemas }}"
            - name: PGRST_DB_MAX_ROWS
              value: "{{ .Values.rest.dbMaxRows }}"
            - name: PGRST_DB_EXTRA_SEARCH_PATH
              value: "{{ .Values.rest.dbExtraSearchPath }}"
            - name: PGRST_DB_ANON_ROLE
              value: "anon"
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
            - name: PGRST_ADMIN_SERVER_HOST
              value: "localhost"
            - name: PGRST_DB_USE_LEGACY_GUCS
              value: "false"
            - name: PGRST_APP_SETTINGS_JWT_EXP
              value: "{{ .Values.auth.jwtExpiry }}"
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: jwt-secret
            - name: PGRST_APP_SETTINGS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: jwt-secret
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supabase.name" . }}-rest
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.rest.port }}
      targetPort: {{ .Values.rest.port }}
  selector:
    {{- include "supabase.selectorLabels" (dict "name" "rest" "root" .) | nindent 4 }}
