apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supabase.name" . }}-auth
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
    {{- include "supabase.selectorLabels" (dict "name" "auth" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "supabase.selectorLabels" (dict "name" "auth" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supabase.selectorLabels" (dict "name" "auth" "root" .) | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "supabase.name" . }}-db {{ .Values.db.port }}; do echo waiting for db; sleep 2; done']
      containers:
        - name: auth
          image: {{ .Values.auth.image }}
          ports:
            - containerPort: {{ .Values.auth.port }}
          env:
            - name: GOTRUE_API_HOST
              value: "0.0.0.0"
            - name: GOTRUE_API_PORT
              value: "{{ .Values.auth.port }}"
            - name: API_EXTERNAL_URL
              value: "{{ .Values.urls.apiExternalUrl }}"
            - name: GOTRUE_DB_DRIVER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: postgres-password
            - name: GOTRUE_DB_DATABASE_URL
              value: "postgres://supabase_auth_admin:$(POSTGRES_PASSWORD)@{{ include "supabase.name" . }}-db:{{ .Values.db.port }}/{{ .Values.db.database }}"
            - name: GOTRUE_SITE_URL
              value: "{{ .Values.auth.siteUrl }}"
            - name: GOTRUE_URI_ALLOW_LIST
              value: "{{ .Values.auth.additionalRedirectUrls }}"
            - name: GOTRUE_DISABLE_SIGNUP
              value: "{{ .Values.auth.disableSignup }}"
            - name: GOTRUE_JWT_ADMIN_ROLES
              value: "service_role"
            - name: GOTRUE_JWT_AUD
              value: "authenticated"
            - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
              value: "authenticated"
            - name: GOTRUE_JWT_EXP
              value: "{{ .Values.auth.jwtExpiry }}"
            - name: GOTRUE_JWT_ISSUER
              value: "{{ .Values.urls.apiExternalUrl }}/auth/v1"
            - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
              value: "{{ .Values.auth.enableEmailSignup }}"
            - name: GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED
              value: "{{ .Values.auth.enableAnonymousUsers }}"
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: "{{ .Values.auth.enableEmailAutoconfirm }}"
            - name: GOTRUE_SMTP_ADMIN_EMAIL
              value: "{{ .Values.auth.smtp.adminEmail }}"
            - name: GOTRUE_SMTP_HOST
              value: "{{ .Values.auth.smtp.host }}"
            - name: GOTRUE_SMTP_PORT
              value: "{{ .Values.auth.smtp.port }}"
            - name: GOTRUE_SMTP_USER
              value: "{{ .Values.auth.smtp.user }}"
            - name: GOTRUE_SMTP_PASS
              value: "{{ .Values.auth.smtp.pass }}"
            - name: GOTRUE_SMTP_SENDER_NAME
              value: "{{ .Values.auth.smtp.senderName }}"
            - name: GOTRUE_MAILER_URLPATHS_INVITE
              value: "{{ .Values.auth.mailer.urlpathsInvite }}"
            - name: GOTRUE_MAILER_URLPATHS_CONFIRMATION
              value: "{{ .Values.auth.mailer.urlpathsConfirmation }}"
            - name: GOTRUE_MAILER_URLPATHS_RECOVERY
              value: "{{ .Values.auth.mailer.urlpathsRecovery }}"
            - name: GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE
              value: "{{ .Values.auth.mailer.urlpathsEmailChange }}"
            - name: GOTRUE_EXTERNAL_PHONE_ENABLED
              value: "{{ .Values.auth.enablePhoneSignup }}"
            - name: GOTRUE_SMS_AUTOCONFIRM
              value: "{{ .Values.auth.enablePhoneAutoconfirm }}"
            - name: GOTRUE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: jwt-secret
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supabase.name" . }}-auth
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.auth.port }}
      targetPort: {{ .Values.auth.port }}
  selector:
    {{- include "supabase.selectorLabels" (dict "name" "auth" "root" .) | nindent 4 }}
