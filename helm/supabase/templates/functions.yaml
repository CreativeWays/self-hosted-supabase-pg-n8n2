apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supabase.name" . }}-functions
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
    {{- include "supabase.selectorLabels" (dict "name" "functions" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "supabase.selectorLabels" (dict "name" "functions" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supabase.selectorLabels" (dict "name" "functions" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: functions
          image: {{ .Values.functions.image }}
          ports:
            - containerPort: {{ .Values.functions.port }}
          args: ["start", "--main-service", "/home/deno/functions/main"]
          env:
            - name: SUPABASE_URL
              value: "http://{{ include "supabase.name" . }}-kong:{{ .Values.kong.httpPort }}"
            - name: SUPABASE_PUBLIC_URL
              value: "{{ .Values.urls.supabasePublicUrl }}"
            - name: SUPABASE_PUBLISHABLE_KEYS
              value: '{"default":""}'
            - name: SUPABASE_SECRET_KEYS
              value: '{"default":""}'
            - name: VERIFY_JWT
              value: "{{ .Values.functions.verifyJwt }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: jwt-secret
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: anon-key
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: service-role-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: postgres-password
            - name: SUPABASE_DB_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@{{ include "supabase.name" . }}-db:{{ .Values.db.port }}/{{ .Values.db.database }}"
          volumeMounts:
            - name: functions-scripts
              mountPath: /home/deno/functions/main/index.ts
              subPath: main-index.ts
            - name: functions-scripts
              mountPath: /home/deno/functions/hello/index.ts
              subPath: hello-index.ts
            - name: deno-cache
              mountPath: /root/.cache/deno
      volumes:
        - name: functions-scripts
          configMap:
            name: {{ include "supabase.name" . }}-functions
        - name: deno-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supabase.name" . }}-functions
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.functions.port }}
      targetPort: {{ .Values.functions.port }}
  selector:
    {{- include "supabase.selectorLabels" (dict "name" "functions" "root" .) | nindent 4 }}
