apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supabase.name" . }}-meta
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
    {{- include "supabase.selectorLabels" (dict "name" "meta" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "supabase.selectorLabels" (dict "name" "meta" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supabase.selectorLabels" (dict "name" "meta" "root" .) | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "supabase.name" . }}-db {{ .Values.db.port }}; do echo waiting for db; sleep 2; done']
      containers:
        - name: meta
          image: {{ .Values.meta.image }}
          ports:
            - containerPort: {{ .Values.meta.port }}
          env:
            - name: PG_META_PORT
              value: "{{ .Values.meta.port }}"
            - name: PG_META_DB_HOST
              value: "{{ include "supabase.name" . }}-db"
            - name: PG_META_DB_PORT
              value: "{{ .Values.db.port }}"
            - name: PG_META_DB_NAME
              value: "{{ .Values.db.database }}"
            - name: PG_META_DB_USER
              value: "postgres"
            - name: PG_META_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: postgres-password
            - name: CRYPTO_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.name" . }}-secrets
                  key: pg-meta-crypto-key
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supabase.name" . }}-meta
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.meta.port }}
      targetPort: {{ .Values.meta.port }}
  selector:
    {{- include "supabase.selectorLabels" (dict "name" "meta" "root" .) | nindent 4 }}
