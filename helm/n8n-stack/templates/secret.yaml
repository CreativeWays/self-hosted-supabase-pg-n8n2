{{/*
  Reuses the existing N8N_ENCRYPTION_KEY on `helm upgrade` (via lookup) so
  saved credentials in n8n don't become unreadable after every deploy.
  On first install, lookup returns nothing and a new key is generated.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secretName }}
{{- $encKey := "" }}
{{- if $existing }}
{{- $encKey = index $existing.data "N8N_ENCRYPTION_KEY" }}
{{- else }}
{{- $encKey = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  N8N_ENCRYPTION_KEY: {{ $encKey }}
  N8N_HOST: {{ .Values.n8nHost | b64enc }}
  N8N_PORT: {{ .Values.n8nPort | b64enc }}
  N8N_PROTOCOL: {{ .Values.n8nProtocol | b64enc }}
