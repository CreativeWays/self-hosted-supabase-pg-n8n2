apiVersion: v2
name: n8n-stack
description: >
  Wrapper chart that installs the official n8n Helm chart (standalone mode)
  plus a Traefik custom entrypoint + Ingress so n8n is reachable from outside
  a local k3s cluster on a fixed port, without relying on NodePort.
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: n8n
    version: "1.10.1"
    repository: "oci://ghcr.io/n8n-io/n8n-helm-chart"
